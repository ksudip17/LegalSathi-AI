services:
  - type: web
    name: legalsaathi-ai
    runtime: python
    rootDir: server/ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: TESSERACT_CMD
        value: /usr/bin/tesseract
      - key: PORT
        value: 8000